services:

  cron:
    build: .
    image: roborock-cron:local
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    volumes:
      # bind the directory holding .roborock.json / .roborock.cache
      # generate tokens locally first: ROBOROCK_CACHE_DIR=./data roborock.py login
      - ./data:/data
      # bind the schedule so it can be edited without rebuilding the image
      - ./crontab:/crontab:ro
